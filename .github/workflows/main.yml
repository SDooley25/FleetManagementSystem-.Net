name: Build, Test, and Push to ACR

on:
  push:
    branches:
      - main

env:
  ACR_NAME: fleetmanagementsystem               # e.g. myregistry (no .azurecr.io)
  ACR_LOGIN_SERVER: fleetmanagementsystem.azurecr.io
  IMAGE_NAME: fleetmanagementsystem

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # REQUIRED for Managed Identity (OIDC)
      contents: read

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # 4. Build solution
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # 5. Run unit tests ✅
      - name: Test
        run: dotnet test --no-build --verbosity normal

      # 6. Azure login using Managed Identity (OIDC)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: az acr check-health -n $ACR_NAME --yes

      # 7. Login to ACR
      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      # 8. Build Docker image
      
      - name: Build Docker Image
        run: |
          docker build \
            -f FleetManagementSystem-.Net/Dockerfile \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            FleetManagementSystem-.Net

      # 9. Push Docker image to ACR
      - name: Push Docker Image
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
          
      #- name: Deploy to App Service
       # uses: azure/webapps-deploy@v2
        #with:
         # app-name: FleetManagementSystem
          #images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update container config
        run: |
            az webapp config container set \
              --name FleetManagementSystem \
              --resource-group Fleet-Management-System \
              --docker-custom-image-name $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
      
